name: Novo Space
description: >-
  Novo Space develops high-performance, radiation-tolerant, modular electronics
  for the most ambitious space missions. Founded by Rodrigo Diez (CEO) and
  Facundo Jorge (CTO), the company builds SpaceVPX single-board computers, mass
  memory and GPU boards, tailored subsystems, and radiation-tolerant FPGA IP
  cores (SpaceWire, SpaceFibre, Ethernet/TCP-IP, CCSDS, NAND controllers,
  floating-point units) that let satellite and spacecraft builders reuse
  qualified hardware instead of re-engineering every mission. Customers and
  partners include Maxar, MIT, Thales Alenia Space, BAE Systems, Leonardo DRS,
  Mitsubishi, the US Air Force, Nvidia, Ansys, and Microchip. Novo Space is a
  space-computing hardware provider and does not publish a public web API,
  developer portal, or SDKs at this time.
